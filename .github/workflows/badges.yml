name: Project Badges

on:
  schedule:
    # 每天 19:45 UTC = 03:45 Asia/Shanghai,跟 total-stars / 3d-contrib 错开避免竞争
    - cron: "45 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/badges.yml
      - scripts/gen_badges.py

permissions:
  contents: write

jobs:
  generate-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate project badge SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          FLAGSHIP_REPO: WDM2VST-Ultra
        run: python scripts/gen_badges.py

      - name: Commit & push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add badge-release.svg badge-downloads.svg badge-stars.svg badge-followers.svg
          git diff --staged --quiet || git commit -m "chore: refresh project badges"
          git push
